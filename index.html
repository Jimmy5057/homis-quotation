<title>HOMIS Quotation Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: rooms rail | room editor | live total. The quote document mirrors the HOMIS Excel sheet. */
:root{
  --bg:#ECEEF1;--surface:#FFFFFF;--sunk:#F4F5F7;--ink:#16202A;--muted:#5A6573;--line:#D6DBE1;
  --navy:#1E2D3C;--navy-ink:#FFFFFF;--gold:#9C7637;--gold-soft:#F3EBDD;--warn:#A0421C;--warn-soft:#F8E7DF;--ok:#2C6A4D;
  --paper:#FFFFFF;--paper-ink:#141414;--paper-line:#C9CDD2;--paper-band:#EEF1F4;
  --f-d:"Jost","IBM Plex Sans",system-ui,sans-serif;
  --f-b:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B;--surface:#17202A;--sunk:#121A22;--ink:#E5E9EE;--muted:#98A4B1;--line:#29353F;
  --navy:#D3B27C;--navy-ink:#141A20;--gold:#D3B27C;--gold-soft:#2A2418;--warn:#EE9A73;--warn-soft:#33201A;--ok:#7CC3A0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B;--surface:#17202A;--sunk:#121A22;--ink:#E5E9EE;--muted:#98A4B1;--line:#29353F;
  --navy:#D3B27C;--navy-ink:#141A20;--gold:#D3B27C;--gold-soft:#2A2418;--warn:#EE9A73;--warn-soft:#33201A;--ok:#7CC3A0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,.amt{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0}
.brand img{height:34px;width:auto;border-radius:5px;display:block}
.brand span{font-family:var(--f-d);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.qtitle{flex:1;min-width:0;display:flex;flex-direction:column}
.qtitle b{font-family:var(--f-d);font-weight:600;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtitle small{color:var(--muted);font-size:.82rem}
.status{font-size:.8rem;color:var(--muted);white-space:nowrap}
.status.bad{color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--navy);color:var(--navy-ink)}
.tabs button small{opacity:.75;margin-left:4px;font-weight:400}
/* buttons and fields */
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:var(--navy-ink);white-space:nowrap}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.warn{background:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--gold);cursor:pointer;padding:0;font-size:.84rem;text-decoration:underline;text-underline-offset:2px}
.ix{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center}
.ix:hover{background:var(--sunk);color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px}
.card h2{font-family:var(--f-d);font-weight:600;font-size:1.15rem;margin:0 0 4px;text-wrap:balance}
.card .lead{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed=true]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 8px 7px 16px;border-radius:999px;font-size:.88rem;z-index:31;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.paper tr.room td{font-size:11.5px!important;text-decoration:none!important;padding-top:3px!important;padding-bottom:3px!important}
.paper tr.sec td{font-size:13.5px}
.paper tr.note td{font-style:italic;font-size:11.5px;color:#555}
.paper tr.room td{border-top:12px solid var(--paper)}
.paper tr.sec+tr.room td,.paper tr.sub+tr.room td{border-top-width:3px}
.paper .pv{border:0;background:none;padding:1px 4px;margin:-1px -4px;font:inherit;color:inherit;cursor:pointer;border-radius:4px;border-bottom:1px dashed #b9a27a;font-variant-numeric:tabular-nums}
.paper .pv:hover{background:#FAF1DF}
.paper .pvin{width:84px;padding:2px 5px;font:inherit;text-align:right;border:1px solid #9C7637;border-radius:4px;background:#fff;color:#141414}
.paper .sign{margin-top:26px;page-break-inside:avoid}
.paper .sgh{background:#1E2D3C;color:#fff;font-weight:700;padding:6px 8px;font-size:13px}
.paper .sign p{font-size:12.5px;margin:8px 0 0}
.paper .sgc{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
.paper .sgl{border-top:1px solid #333;margin-bottom:5px}
.paper .sgf{display:grid;grid-template-columns:90px 1fr;gap:8px 8px;margin-top:10px;font-size:12.5px}
.paper .sgf span:nth-child(even){border-bottom:1px solid #bbb;min-height:16px}
.pkbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pkrem{font-size:.86rem;font-weight:600;color:var(--gold)}
.pkrem.full{color:var(--warn)}
.sbtn.pkn .sno{background:var(--gold);color:#fff}
:root{--z:.7}
html{zoom:var(--z)}
.backb,.zoomb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;cursor:pointer;height:36px;padding:0 12px;font-size:1.1rem;font-weight:600;flex:none}
.zoomb{font-size:.8rem;color:var(--muted)}
.backb:hover,.zoomb:hover{border-color:var(--gold)}
.ledbox{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:3px 8px}
.ledbox.on{border-style:solid;border-color:var(--gold);color:var(--ink)}
.ledbox label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.ledbox input{width:15px;height:15px;margin:0;accent-color:var(--navy)}
.refsec{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px}
.refsec label{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
.refsec small{color:var(--muted)}
.refsec input[type=number]{width:96px}
.refsum{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:3px;font-size:.88rem}
.paper tr.sec.add td{background:#9C7637}
.paper tr.sec.less td{background:#A23B2A}
.paper tr.part td{background:#5E451A;color:#fff;font-weight:800;font-size:14.5px;letter-spacing:.04em;padding:10px 6px;border-top:22px solid var(--paper)}
[data-drag].dragging{opacity:.4}
.achips .chip.dropb{box-shadow:-3px 0 0 var(--gold)}.achips .chip.dropa{box-shadow:3px 0 0 var(--gold)}
.rli.dropb{box-shadow:0 -3px 0 var(--gold)}.rli.dropa{box-shadow:0 3px 0 var(--gold)}
.rli{grid-template-columns:auto minmax(0,1fr) 160px auto}
@media (max-width:520px){.rli{grid-template-columns:auto minmax(0,1fr) auto}}
.rli .grip{cursor:grab;color:var(--muted);font-size:1.1rem;padding:0 4px;user-select:none}
textarea.xfer{width:100%;min-height:70px;margin-top:8px;font:12px/1.35 ui-monospace,monospace;word-break:break-all;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.undo[hidden]{display:none!important}
.undo .btn{background:var(--gold);color:#141A20}
.res{display:block!important;max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 6px 6px;background:var(--surface)}
.res .g{position:sticky;top:0;background:var(--surface);padding:8px 4px 4px;margin:0;z-index:1}
.res .g.sep{border-top:1px solid var(--line);margin-top:6px}
.ckrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-radius:8px}
.ckrow:hover{background:var(--sunk)}
.ckrow.on{background:var(--gold-soft)}
.ckrow label{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0;flex:1;padding:3px 0}
.ckrow input{width:19px;height:19px;accent-color:var(--navy);margin:0;flex:none}
.ckrow span{min-width:0;font-size:.9rem;line-height:1.25}
.ckrow span i{display:block;font-style:normal;color:var(--muted);font-size:.76rem}
.ckrow small{color:var(--muted);font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.grp>summary,.ghd{padding:11px 14px;display:flex;gap:10px;align-items:baseline;list-style:none;cursor:pointer;flex-wrap:wrap}
.ghd{cursor:default}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"\25B8";color:var(--muted);transition:transform .15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.grp>summary span{color:var(--muted);font-size:.84rem}
.grp>summary em{margin-left:auto;font-style:normal;color:var(--gold);font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums}
.gsub{font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px 3px;border-top:1px solid var(--line)}
.ck{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px 6px 14px;border-top:1px solid var(--line)}
.gsub+.ck{border-top:0}
.ck:hover{background:var(--sunk)}
.ck.on{background:var(--gold-soft)}
.ck.more{padding-left:30px}
.ckl{display:flex;gap:10px;align-items:center;flex:1 1 230px;min-width:0;cursor:pointer}
.ckl input[type=checkbox]{width:19px;height:19px;accent-color:var(--navy);margin:0;flex:none}
.ckl span{min-width:0;font-size:.92rem;line-height:1.25}
.ckl span i{display:block;font-style:normal;color:var(--muted);font-size:.76rem}
.ckc{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.hint{color:var(--muted);font-size:.8rem;white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}
.szw{display:inline-flex;align-items:center;gap:4px}
.szw small{color:var(--muted);font-size:.78rem}
.ck input.rem{width:150px;padding:6px 9px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip.sm{padding:4px 9px;font-size:.78rem}
.chip.sm small{color:var(--muted);font-variant-numeric:tabular-nums}
.colsel{width:auto!important;padding:6px 8px}
.ck .sz{width:68px;padding:6px 7px}
.pbtn{border:1px dashed var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;min-width:100px;text-align:right}
.pbtn:hover{border-color:var(--gold)}
.pbtn.ed{border-style:solid;border-color:var(--gold);color:var(--gold)}
input.pin{width:108px;padding:6px 9px;text-align:right;border-color:var(--gold)}
.amt2{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ix.act{background:var(--navy);color:var(--navy-ink)}
.cdesc{flex:1;min-width:0;padding:6px 9px}
.det{margin:0 10px 8px 42px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ptsum{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:none;cursor:pointer;text-align:left;font-size:.86rem;color:var(--ink);padding:0;flex-wrap:wrap}
.ptsum .num{color:var(--gold);font-weight:600;white-space:nowrap}
.pbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.pbx{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;cursor:pointer;padding:11px 14px;text-align:left;flex-wrap:wrap}
.pbx b{font-family:var(--f-d);font-weight:600}
.pbx span{color:var(--muted);font-size:.88rem;flex:1;min-width:0}
.pbx em{font-style:normal;color:var(--gold);font-weight:600;font-size:.88rem}
.pbar.open .pbx{border-bottom:1px solid var(--line)}
.pbody{padding:14px}
.pbody .proj{gap:14px}
.pbody .card{border:0;padding:0}
.bw{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.bw{grid-template-columns:196px minmax(0,1fr)}}
@media (min-width:1240px){.bw{grid-template-columns:196px minmax(0,1fr) 270px}}
.snav{display:flex;flex-direction:column;gap:3px;min-width:0}
@media (min-width:900px){.snav{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));align-self:start}}
@media (max-width:899px){.snav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.sbtn{flex:none}}
.sbtn{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid transparent;background:none;border-radius:9px;padding:8px 9px;cursor:pointer;text-align:left}
.sbtn:hover{background:var(--surface)}
.sbtn[aria-pressed=true]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--gold)}
.sno{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.sbtn[aria-pressed=true] .sno{background:var(--navy);color:var(--navy-ink)}
.stt{font-size:.9rem;line-height:1.2;min-width:0}
.stt i{display:block;font-style:normal;font-size:.72rem;color:var(--muted)}
.sbtn small{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.phead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.phead h2{font-family:var(--f-d);font-weight:600;font-size:1.3rem;margin:0}
.phead h2 span{font-size:.85rem;color:var(--muted);font-weight:400;font-family:var(--f-b)}
.phead p{margin:2px 0 0;color:var(--muted);font-size:.84rem;max-width:62ch}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.achips .chip small{margin-left:6px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.achips .chip[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.achips .chip[aria-pressed=true] small{color:var(--navy-ink)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plist .srow{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.plist .srow input{flex:1;max-width:360px}
.showall{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:9px 14px;text-align:left;cursor:pointer;color:var(--gold);font-weight:600;font-size:.86rem}
.cubar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 2px 0;font-size:.84rem;color:var(--muted)}
.ck.dim{opacity:.55}
.ck .asel{width:auto;max-width:150px;padding:6px 8px}
.ck input.lname{flex:1;min-width:0;padding:5px 8px;font-size:.92rem;background:var(--surface)}
.srow2.sj{width:100%;border:0;background:none;cursor:pointer;color:inherit;text-align:left;border-radius:6px}
.srow2.sj:hover{background:var(--sunk)}
.top .btn{margin-left:auto}
.whof{justify-content:space-between}
.iam{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.iam select{width:auto;padding:6px 9px}
.chip:disabled{opacity:.5;cursor:not-allowed}
.sugg{margin-bottom:16px;border-color:var(--gold)}
.sgrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.sgtxt{flex:1 1 320px;min-width:0;font-size:.9rem}
.sgact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sgact input[type=text]{width:240px;padding:6px 9px}
.sgact select{width:auto;padding:6px 8px}
.sgp{display:inline-flex;align-items:center;gap:4px;font-size:.84rem;color:var(--muted)}
.sgp input{width:90px;padding:6px 8px}
.cklead{margin:10px 0 6px;font-size:.84rem;color:var(--muted)}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:.86rem;margin-bottom:14px}
/* home */
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.homehead h1{font-family:var(--f-d);font-weight:600;font-size:1.9rem;margin:0;letter-spacing:-.01em}
.homehead p{margin:2px 0 0;color:var(--muted)}
.qfilter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qfilter input{max-width:320px}
.qlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.qcard:hover{border-color:var(--gold)}
.qcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qcard b{font-family:var(--f-d);font-weight:600;font-size:1.08rem}
.qcard .loc{color:var(--muted);font-size:.86rem}
.qcard .tot{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.qcard .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.8rem;align-items:center}
.pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 9px;letter-spacing:.03em;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.sent{color:var(--gold);border-color:var(--gold)}
.pill.won{color:var(--ok);border-color:var(--ok)}
.pill.lost{color:var(--warn);border-color:var(--warn)}
.empty{border:1.5px dashed var(--line);border-radius:13px;padding:28px;text-align:center;color:var(--muted)}
/* build */
.build{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.build{grid-template-columns:230px minmax(0,1fr)}}
@media (min-width:1180px){.build{grid-template-columns:230px minmax(0,1fr) 300px}}
.rail{display:flex;flex-direction:column;gap:4px;min-width:0}
.rail .rbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.rail .rbtn:hover{background:var(--surface)}
.rail .rbtn[aria-pressed=true]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--gold)}

  if(m==='manual')return ks.filter(k=>+((r.man||{})[k])>0);
  return ks.filter(k=>!['pre','appl'].includes(k)&&(r.pkg||!['pkg','pkroom'].includes(k)))}
function pstep(p){return p>=100?10:p>=10?1:0.1}
const r2=x=>Math.round(x*100)/100;
function refApply(q,rows,secTot,base){
  const r=q.ref,target=refAmt(q,base),ks=refSecs(q,secTot),m=refMode(q);
  const elig=ks.reduce((a,k)=>a+secTot[k],0);const share={};
  ks.forEach(k=>share[k]=m==='manual'?+r.man[k]:(elig?target*secTot[k]/elig:0));
  const U={},H={};let cur=null;
  rows.forEach(row=>{if(row.type==='sec'){cur=row;H[row.k]=row;if(row.k==='pkg')(U.pkg=[]).push({qty:1,price:row.amount,hdr:row});return}
    if(cur&&cur.k!=='pkg'&&row.type==='item'&&row.price>0&&row.qty>0)(U[cur.k]=U[cur.k]||[]).push({qty:+row.qty,price:+row.price,row})});

  ks.forEach(k=>{const us=U[k]||[];const sum=us.reduce((a,u)=>a+u.qty*u.price,0);if(!sum||!(share[k]>0))return;const fct=(sum+share[k])/sum;
    us.forEach(u=>{const st=pstep(u.price);u.np=r2(Math.round(u.price*fct/st)*st)});
    const got=us.reduce((a,u)=>a+u.qty*(u.np-u.price),0);
    if(got<share[k]-0.005){const one=us.filter(u=>u.qty===1).sort((a,b)=>b.price-a.price)[0];const big=one||us.slice().sort((a,b)=>b.qty*b.price-a.qty*a.price)[0];const st=one?10:pstep(big.price);
      big.np=r2(big.np+Math.ceil((share[k]-got)/big.qty/st-1e-9)*st)}

}

function checks(q,A){

  q.lines.forEach(l=>{const c=calc(l,q);const nm=l.cu?(l.d||'Custom item'):(ITEM[l.k]||{}).n;const rn=roomOf(q,l.room).name;const sec=secOf(l);
    if(!c.amount)w.push({t:nm+' in '+rn+' has no price',room:l.room,id:l.id,sec});
    if(c.costAmt>0&&c.amount<c.costAmt*1.3)w.push({t:'Low margin: '+nm+' in '+rn+' ('+Math.round((1-c.costAmt/c.amount)*100)+'%)',room:l.room,id:l.id,sec});
    if(l.k==='strip'&&!nz(l.tag))w.push({t:'LED strip in '+rn+': say where (e.g. TV cabinet)',room:l.room,id:l.id,info:1,sec});
  });
  if(hasPaint(q)&&q.lines.some(l=>l.k==='touch'))w.push({t:'Touch-up painting is not needed: whole unit painting is already included',sec:'other'});
  if(q.lines.filter(l=>['paintAll','paintW','paintWC'].includes(l.k)).length>1)w.push({t:'More than one whole unit painting line. Keep only one.',sec:'cw'});
  if(q.package&&+q.sf&&pkSizeOf(q)!==q.package.size)w.push({t:'Unit size is '+q.sf+' sqft but the package is priced for '+(q.package.size==='lt'?'below':'above')+' 1,000 sqft',sec:'pkg'});
  if(A&&A.ref){if(!A.ref.secs.length)w.push({t:'Referral fee is set but no section is chosen to carry it',tab:'project'});
    else if(refMode(q)==='manual'&&Math.abs(A.ref.secs.reduce((a,k)=>a+(+q.ref.man[k]||0),0)-refAmt(q,A.base))>0.5)w.push({t:'Referral amounts typed per section do not add up to the referral fee ('+fm(refAmt(q,A.base))+')',tab:'project'})}
  if(!q.package&&!q.lines.some(l=>l.k==='clean'))w.push({t:'General cleaning is missing',sec:'other'});

function cabName(l){const it=ITEM[l.k]||{};if(it.kind==='k')return nz(l.tag)?l.tag:it.tag;return String(it.n||'cabinet').replace(/\s*\(.*?\)\s*/g,' ').replace(/,.*$/,'').trim()}
function cabLen(l){const it=ITEM[l.k]||{};
  if(it.kind==='k'){const ps=l.parts||[];const w=ps.find(p=>['wallN','wallFH','wall'].includes(p.k))||ps.find(p=>p.k==='base'||p.k==='island');return w&&+w.n>0?+w.n:6}
  if(it.kind==='d'&&it.u==='ft'){const v=nz(l.size)?+l.size:it.d;return v>0?v:6}
  return 6}
function ledLen(q,l){q.lines.forEach(x=>{if(x.link===l.id&&x.k==='stripFt'&&!x.own)x.size=cabLen(l)})}
function ledSync(q,l){
  const keep={};q.lines.filter(x=>x.link===l.id).forEach(x=>{keep[x.k]=x});
  q.lines=q.lines.filter(x=>x.link!==l.id);
  if(!ledOn(l))return;

  const add=(k,ext)=>{const old=keep[k];const n=mkLine(k,l.room,1,Object.assign({link:l.id},ext));if(old&&nz(old.price))n.price=old.price;if(old&&old.own){n.size=old.size;n.own=1}q.lines.splice(pos++,0,n)};
  if(w.strip!==false)add('stripFt',{tag:cabName(l),size:cabLen(l),pt:false});
  if(w.pt!==false)add('xwire',{});
  if(w.sw!==false)add('xswitch',{});
}

async function flush(){

  document.querySelectorAll('[data-pc]').forEach(el=>{const[id,i]=el.dataset.pc.split(':');const l=q.lines.find(x=>x.id===id);if(l&&l.parts[i])el.textContent=fm(partCost(l.parts[i],matOf(l,ITEM[l.k])))});

  const pb=document.getElementById('ptbox');
  if(pb&&!pb.contains(document.activeElement)){const tmp=document.createElement('div');tmp.innerHTML=ptsV(q,roomOf(q,S.room));pb.replaceWith(tmp.firstElementChild||document.createElement('span'))}
  else if(pb){autoPts(q,S.room).forEach(p=>{const el=pb.querySelector(`[data-pta="${p.k}"]`);if(el)el.textContent=fm(p.amount)})}
  else if(autoPts(q,S.room).length){const ed=document.getElementById('editor');if(ed&&!ed.contains(document.activeElement)){ed.innerHTML=editorV(q,A)}}
  document.querySelectorAll('[data-amt2]').forEach(el=>{const l=q.lines.find(x=>x.id===el.dataset.amt2);if(l)el.textContent=amtTxt(calc(l,q))});

  {const ls=q.lines.filter(l=>l.room===S.room&&!l.cu);const by={};ls.forEach(l=>(by[l.k]=by[l.k]||[]).push(l));const com=new Set(SUGGEST[roomOf(q,S.room).type]||SUGGEST.bed);
   document.querySelectorAll('[data-secsum]').forEach(el=>{const k=el.dataset.secsum;el.textContent=secSum(q,CAT.filter(it=>it.s===k&&!com.has(it.k)&&by[it.k]),by)})}
  document.querySelectorAll('[data-st]').forEach(el=>{const v=A.secTot[el.dataset.st];el.textContent=v?fm(v):''});
  document.querySelectorAll('[data-at]').forEach(el=>{const v=areaAmt(q,S.sec,el.dataset.at);el.textContent=v?fm(v):''});
  {const pt=document.getElementById('pkTot');const pc=pkCalc(q);if(pt&&pc)pt.textContent=rm(pc.price-pc.deduct+pc.roomsTot)}
  {const st2=document.getElementById('secTot');if(st2)st2.textContent=rm(A.secTot[S.sec]||0)}
  const st=document.getElementById('sideTot');if(st)st.textContent=rm(A.total);
  const si=document.getElementById('sideIn');if(si)si.innerHTML=sideInner(q,A,checks(q,A),A.costCov-A.cost);

function line(id){return S.q.lines.find(l=>l.id===id)}
function migrate(q){let ch=false;if(!q.roomOrdered&&Array.isArray(q.rooms)){const top=['foyer','living'];const was=q.rooms.map(r=>r.id).join();
    q.rooms=[...q.rooms.filter(r=>r.type==='foyer'),...q.rooms.filter(r=>r.type==='living'),...q.rooms.filter(r=>!top.includes(r.type))];if(q.rooms.map(r=>r.id).join()!==was)ch=true}(q.pkLines||[]).forEach(l=>{if(l.removed&&PK_HIDE.includes(l.k)){delete l.removed;l.hidden=true;ch=true}});(q.lines||[]).forEach(l=>{
  if(l.k==='fanA'){l.k='fanLED';if(!nz(l.rem))l.rem='Alpha';ch=true}
  else if(l.cu&&(SECMAP[l.cu.sec]||l.cu.sec)==='carp'&&!nz(l.size)&&nz(l.qty)&&+l.qty%1!==0){l.size=+l.qty;l.rate=+l.price||0;l.qty=1;l.price='';ch=true}
  else if(l.k==='heaterI'){l.k='aHeaterI';if(!nz(l.price))l.price=160;ch=true}
  else if(l.k==='fanP'){l.k='fanStd';if(!nz(l.rem))l.rem='Panasonic';if(!nz(l.price))l.price=850;ch=true}
  if(Array.isArray(l.parts))l.parts.forEach(p=>{if(p.k==='wall'){p.k='wallN';ch=true}});
  if(l.k==='fanN'&&false){}
  else if(l.k==='fanN'){l.k='fanStd';if(!nz(l.price))l.price=340;ch=true}});return ch}
function openQ(q){S.q=clone(q);const mig=migrate(S.q);S.view='quote';S.tab='build';S.sec=q.package?'pkg':'pre';S.projOpen=!q.rooms.length;S.showAll=false;S.room=q.rooms[0]?q.rooms[0].id:null;S.search='';S.secF='';S.confirm=null;S.openWord={};S.openDet={};S.pedit=null;S.ptOpen=false;S.secOpen={};S.dirty=false;setSave(S.mode==='shared'?'Saved for the team':'Saved on this device');render();window.scrollTo(0,0);if(mig){touch();toast("Old fan items updated to the current list")}}
function addLine(k,room,qty,ext){const l=mkLine(k,room,qty,ext);
  /* keep dash lines (appliances) right after the last kitchen cabinet in the room */
  const it=ITEM[k];let pos=S.q.lines.length;

const NAV_ACTS=['home','prices','new','open','tab','sec','area','proj','goto','room','dup','newrev'];
async function goBack(){

  if(st.view==='quote'){
    if(!S.q||S.q.id!==st.qid){const x=S.list[st.qid];if(!x){toast('That quotation is no longer available');S.view='home';S.q=null;render();return}openQ(x)}

}

    R.getCell(2).value=row.no||null;R.getCell(3).value=parts[0];R.getCell(2).font=R.getCell(3).font=B;

    R.getCell(8).value={formula:`F${r}*G${r}`,result:row.amount};R.getCell(8).numFmt=nf;[6,7,8].forEach(i=>R.getCell(i).font=B);
    if(I&&row.cost!=null){R.getCell(9).value=row.cost;R.getCell(9).numFmt=nf;R.getCell(10).value={formula:`IF(H${r}=0,"",1-I${r}/H${r})`,result:row.amount?1-row.cost/row.amount:''};R.getCell(10).numFmt='0%';[9,10].forEach(i=>R.getCell(i).font={...B,color:{argb:'FF7A5A24'}})}
    r++;parts.slice(1).forEach(t=>{ws.getRow(r).getCell(3).value=t;ws.getRow(r).getCell(3).font=B;r++});
    const nxt=A.rows[ix+1];if(nxt&&nxt.type==='sec')r++;
  });
  if(secCell)closeSec(r-1);
  r++;const T=ws.getRow(r);T.getCell(6).value='TOTAL';T.getCell(6).font={...B,bold:true};
  T.getCell(8).value={formula:secCells.length?'SUM('+secCells.join(',')+')':'0',result:A.total};T.getCell(8).numFmt='"RM "#,##0.00';T.getCell(8).font={...B,bold:true,size:12};T.getCell(8).border={top:{style:'thin'},bottom:{style:'double'}};
  if(I){T.getCell(9).value=A.cost;T.getCell(9).numFmt=nf;T.getCell(9).font={...B,bold:true,color:{argb:'FF7A5A24'}}}
  ws.getRow(r+2).getCell(3).value='Note: All Prices quoted are valid for 30 days from the date of stated on the quotation.';ws.getRow(r+2).getCell(3).font={...B,italic:true};
  {let sr=r+4;const H=ws.getRow(sr);for(let ci=2;ci<=8;ci++){const cc=H.getCell(ci);cc.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E2D3C'}};cc.font={...B,bold:true,color:{argb:'FFFFFFFF'}}}H.getCell(2).value='ACCEPTANCE OF QUOTATION';
   ws.getRow(sr+1).getCell(3).value='I / We hereby accept this quotation, including the items, prices and terms stated above, and authorise HOMIS to proceed with the works.';ws.getRow(sr+1).getCell(3).font=B;
   const L=sr+5;[3,4].forEach(c=>ws.getRow(L).getCell(c).border={bottom:{style:'thin'}});[7,8].forEach(c=>ws.getRow(L).getCell(c).border={bottom:{style:'thin'}});
   ws.getRow(L+1).getCell(3).value='Customer Signature';ws.getRow(L+1).getCell(3).font={...B,bold:true};ws.getRow(L+1).getCell(7).value='For and on behalf of HOMIS';ws.getRow(L+1).getCell(7).font={...B,bold:true};
   [['Name:',q.client||'','Name:',q.by||''],['IC No.:','','Designation:','Interior Designer'],['Date:','','Date:','']].forEach((rw,i)=>{const R=ws.getRow(L+2+i);R.getCell(3).value=rw[0];R.getCell(4).value=rw[1];R.getCell(7).value=rw[2];R.getCell(8).value=rw[3];[3,4,7,8].forEach(c=>{R.getCell(c).font=B;R.getCell(c).alignment={horizontal:'left'}});R.getCell(4).border={bottom:{style:'hair'}};R.getCell(8).border={bottom:{style:'hair'}}});
   ws.getRow(L+6).getCell(7).value='Company stamp';ws.getRow(L+6).getCell(7).font={...B,size:9,color:{argb:'FF888888'}}}
  for(let i=hr+1;i<=r+2;i++){[6,7,8].forEach(c=>{const cell=ws.getRow(i).getCell(c);if(!cell.alignment)cell.alignment={horizontal:'right'}})}
  const buf=await wb.xlsx.writeBuffer();
  await saveFile(fileBase(q)+(I?' (internal)':'')+'.xlsx',new Blob([buf]),'Excel');
}
async function exportPdf(){
  const q=S.q,A=assemble(q);toast('Building PDF…');
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')}catch(e){toast('Could not load the PDF library. Check your connection.');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,M=14;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('HOMIS QUOTATION',M,18);
  try{doc.addImage(LOGO,'PNG',W-M-44,8,44,26)}catch(e){}
  doc.setFontSize(9.5);
  const info=[['Client Name:',q.client],['Contact Number:',q.contact],['Location:',q.location],['Unit Number:',q.unit],['Unit Size:',unitSizeTxt(q)],['Theme:',q.theme],['Key Collection:',q.keys],['Package:',q.pkg]];
  info.forEach(([k,v],i)=>{doc.setFont('helvetica','normal');doc.text(k,M,27+i*5);doc.setFont('helvetica',i===0?'bold':'normal');doc.text(String(v||''),M+32,27+i*5)});
  const dt=q.date?new Date(q.date+'T00:00:00').toLocaleDateString('en-GB'):'';
  [['Prepared By:',q.by],['Date:',dt],['Revision:','R'+(q.rev||1)]].forEach(([k,v],i)=>{doc.setFont('helvetica','normal');doc.text(k,W-M-56,52+i*5);doc.text(String(v||''),W-M-30,52+i*5)});
  const NAVY=[30,45,60],BAND=[238,241,244];const body=[];
  A.rows.forEach((r,ix)=>{
    if(r.type==='part'){body.push([{content:'',colSpan:5,styles:{minCellHeight:7,cellPadding:0}}]);
      const ps={fontStyle:'bold',fillColor:[94,69,26],textColor:255,fontSize:11.5,cellPadding:{top:3.2,bottom:3.2,left:2,right:2}};
      body.push([{content:'',styles:ps},{content:r.title,colSpan:3,styles:ps},{content:'RM '+f2(r.amount),styles:{...ps,halign:'right'}}]);return}
    if(r.type==='sec'){if(ix)body.push([{content:'',colSpan:5,styles:{minCellHeight:4,cellPadding:0}}]);const SC=r.tone==='add'?[156,118,55]:r.tone==='less'?[162,59,42]:NAVY;
      body.push([{content:r.no,styles:{fontStyle:'bold',fillColor:SC,textColor:255,fontSize:10,cellPadding:{top:2.4,bottom:2.4,left:2,right:2}}},{content:r.title,colSpan:3,styles:{fontStyle:'bold',fillColor:SC,textColor:255,fontSize:10,cellPadding:{top:2.4,bottom:2.4,left:2,right:2}}},{content:'RM '+f2(r.amount),styles:{fontStyle:'bold',halign:'right',fillColor:SC,textColor:255,fontSize:10,cellPadding:{top:2.4,bottom:2.4,left:2,right:2}}}]);return}
    if(r.type==='room'){const pv=A.rows[ix-1];if(pv&&pv.type!=='sec'&&pv.type!=='sub')body.push([{content:'',colSpan:5,styles:{minCellHeight:3.2,cellPadding:0}}]);body.push([{content:r.no,styles:{fontStyle:'bold',fillColor:BAND,fontSize:8.5,cellPadding:{top:1.1,bottom:1.1,left:2,right:2}}},{content:r.title,colSpan:4,styles:{fontStyle:'bold',fillColor:BAND,fontSize:8.5,cellPadding:{top:1.1,bottom:1.1,left:2,right:2}}}]);return}
    if(r.type==='sub'){body.push(['',{content:r.text,colSpan:4,styles:{fontStyle:'bolditalic',cellPadding:{top:2.4,bottom:1,left:2,right:2}}}]);return}
    if(r.type==='sp'){body.push(['',{content:'SUPPLY POINT',colSpan:4,styles:{fontStyle:'italic',fontSize:7.5,textColor:[110,110,110],cellPadding:{top:1.6,bottom:0.4,left:2,right:2}}}]);return}
    if(r.type==='pitem'){body.push([r.no,r.desc,{content:fm(r.qty),styles:{halign:'right'}},'','']);return}
    if(r.type==='note'){body.push(['',{content:r.text,colSpan:4,styles:{fontStyle:'italic',textColor:[95,95,95],fontSize:8,cellPadding:{top:0.2,bottom:0.2,left:4,right:2}}}]);return}
    body.push([r.no,r.desc,{content:fm(r.qty),styles:{halign:'right'}},{content:f2(r.price),styles:{halign:'right'}},{content:f2(r.amount),styles:{halign:'right'}}])});
  body.push([{content:'',colSpan:5,styles:{minCellHeight:4,cellPadding:0}}]);
  body.push([{content:'',styles:{fillColor:NAVY}},{content:'TOTAL',colSpan:3,styles:{halign:'right',fontStyle:'bold',fillColor:NAVY,textColor:255,fontSize:11}},{content:'RM '+f2(A.total),styles:{halign:'right',fontStyle:'bold',fillColor:NAVY,textColor:255,fontSize:11}}]);
  doc.autoTable({startY:72,head:[['No.','Item','Qty','Price','Sub-total']],body,theme:'plain',margin:{left:M,right:M},
    styles:{font:'helvetica',fontSize:9,cellPadding:{top:1.5,bottom:1.5,left:2,right:2},valign:'top',lineColor:[200,205,210]},
    headStyles:{fontStyle:'bold',fillColor:[30,45,60],textColor:255},
    columnStyles:{0:{cellWidth:10},2:{cellWidth:14},3:{cellWidth:24},4:{cellWidth:28}},
    didDrawPage:d=>{doc.setFontSize(8);doc.setTextColor(120);doc.text('HOMIS Property Makeover & Management · '+(q.client||'')+' · R'+(q.rev||1),M,290);doc.text('Page '+doc.internal.getNumberOfPages(),W-M,290,{align:'right'});doc.setTextColor(0)}});
  let y=doc.lastAutoTable.finalY+8;if(y>282){doc.addPage();y=20}doc.setFontSize(9);doc.setFont('helvetica','italic');doc.text('Note: All prices quoted are valid for 30 days from the date stated on the quotation.',M,y);
  /* acceptance & signature block, kept together on one page */
  y+=12;if(y>222){doc.addPage();y=22}
  doc.setFillColor(30,45,60);doc.rect(M,y-5,W-2*M,7,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('ACCEPTANCE OF QUOTATION',M+2,y);doc.setTextColor(0);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(doc.splitTextToSize('I / We hereby accept this quotation, including the items, prices and terms stated above, and authorise HOMIS to proceed with the works.',W-2*M),M,y+8);
  const cw=(W-2*M-14)/2,sy=y+34;
  [[M,'Customer Signature',[['Name:',q.client||''],['IC No.:',''],['Date:','']]],[M+cw+14,'For and on behalf of HOMIS',[['Name:',q.by||''],['Designation:','Interior Designer'],['Date:','']]]].forEach(([x,t,rows])=>{
    doc.setDrawColor(60);doc.setLineWidth(0.3);doc.line(x,sy,x+cw,sy);doc.setFont('helvetica','bold');doc.text(t,x,sy+5);doc.setFont('helvetica','normal');
    rows.forEach(([k,v],i)=>{const yy=sy+12+i*7;doc.text(k,x,yy);doc.text(String(v),x+24,yy);doc.setDrawColor(170);doc.line(x+23,yy+1,x+cw,yy+1)})});
  doc.setFontSize(8);doc.setTextColor(120);doc.text('Company stamp',M+cw+14,sy+38);doc.setTextColor(0);
  await saveFile(fileBase(q)+'.pdf',doc.output('blob'),'PDF');
}
function copyWA(btn){
  const q=S.q,A=assemble(q);
  const lines=['*HOMIS Quotation*',(q.client||'')+(q.location||q.unit?' · '+[q.location,q.unit].filter(Boolean).join(' '):''),'Revision R'+(q.rev||1)+(q.date?' · '+new Date(q.date+'T00:00:00').toLocaleDateString('en-GB'):''),''];
  A.rows.filter(r=>r.type==='sec').forEach(r=>lines.push(r.no+' '+(SEC.find(s=>s.t===r.title)||{s:r.title}).s+': RM '+fm(r.amount)));
  lines.push('','*Total: RM '+f2(A.total)+'*','Prices valid for 30 days. Full quotation attached.');
  const txt=lines.join('\n');
  const done=()=>toast('Copied. Paste into WhatsApp.');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>showCopy(txt))}else showCopy(txt);
}
function showCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:16px;right:16px;bottom:90px;height:180px;z-index:40;width:auto';document.body.appendChild(ta);ta.select();toast('Select all and copy');ta.addEventListener('blur',()=>ta.remove())}
